
<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pozivnica ☕</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffe4ec, #e7ddff, #fff0db);
    overflow: hidden;
    color: #493344;
}

.card {
    width: min(90%, 420px);
    padding: 35px 22px;
    background: rgba(255,255,255,0.85);
    border: 1px solid white;
    border-radius: 28px;
    box-shadow: 0 15px 50px #8b658b30;
    text-align: center;
    position: relative;
    z-index: 1;
}

.emoji {
    font-size: 60px;
    animation: float 2s infinite ease-in-out;
}

@keyframes float {
    50% { transform: translateY(-8px); }
}

h1 {
    font-size: 28px;
    margin: 15px 0;
}

p {
    color: #80677b;
    line-height: 1.6;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: 28px;
    min-height: 50px;
}

button {
    border: none;
    border-radius: 14px;
    padding: 14px 25px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: transform .2s;
}

button:active {
    transform: scale(.95);
}

#yes {
    background: #e88bb5;
    color: white;
    box-shadow: 0 5px 15px #e88bb550;
}

#no {
    background: #eee8f4;
    color: #715c78;
    position: relative;
    z-index: 5;
}

#result {
    display: none;
    margin-top: 25px;
    animation: appear .5s ease;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

input {
    width: 100%;
    padding: 13px;
    margin-top: 12px;
    border: 1px solid #e6bfd5;
    border-radius: 12px;
    background: white;
    color: #493344;
    font-size: 16px;
}

#confirm {
    margin-top: 15px;
    background: #c8b5f5;
    color: #3e3058;
    width: 100%;
}

#final {
    display: none;
    font-weight: bold;
    color: #a34b7c;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="card">
    <div class="emoji">☕💗</div>

    <h1>Jedno malo pitanje...</h1>

    <p>
        Želiš li na kafu sa mnom neki dan? 🙈
        <br>
        Obećavam da ću biti dobro društvo.
    </p>

    <div class="buttons" id="buttons">
        <button id="yes">Da 💗</button>
        <button id="no">Ne 🙃</button>
    </div>

    <div id="result">
        <h2>U redu, vidimo se! 💕</h2>
        <p>Sad još samo da izaberemo dan za naš dejt. ☕</p>

        <label for="date">Kada ti odgovara?</label>
        <input type="date" id="date">

        <button id="confirm">Dogovoreno! 💌</button>
        <div id="final"></div>
    </div>
</div>

<script>
const no = document.getElementById("no");
const yes = document.getElementById("yes");
const buttons = document.getElementById("buttons");
const result = document.getElementById("result");
const dateInput = document.getElementById("date");

function runAway() {
    no.style.position = "fixed";

    const padding = 15;
    const maxX = window.innerWidth - no.offsetWidth - padding;
    const maxY = window.innerHeight - no.offsetHeight - padding;

    const x = padding + Math.random() * Math.max(0, maxX - padding);
    const y = padding + Math.random() * Math.max(0, maxY - padding);

    no.style.left = x + "px";
    no.style.top = y + "px";
}

no.addEventListener("pointerenter", runAway);
no.addEventListener("click", runAway);
no.addEventListener("touchstart", function(e) {
    e.preventDefault();
    runAway();
}, { passive: false });

yes.addEventListener("click", function() {
    buttons.style.display = "none";
    no.style.display = "none";
    result.style.display = "block";

    const today = new Date();
    const localToday = new Date(
        today.getTime() - today.getTimezoneOffset() * 60000
    ).toISOString().split("T")[0];

    dateInput.min = localToday;
});

document.getElementById("confirm").addEventListener("click", function() {
    if (!dateInput.value) {
        dateInput.focus();
        dateInput.reportValidity();
        return;
    }

    const [year, month, day] = dateInput.value.split("-");
    const formattedDate = `${day}.${month}.${year}.`;

    const final = document.getElementById("final");
    final.textContent = `Važi, onda je naš dejt ${formattedDate}! ☕💗`;
    final.style.display = "block";
});
</script>

</body>
</html>
